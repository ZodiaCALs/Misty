version = 1

[[annotations]]
path = ["platforms/**", "tokens/**", "scripts/**", "NOTICE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ZodiaCALs"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["README.md", "LICENSE.md", "TRADEMARKS.md", "CHANGELOG.md", "CONTRIBUTING.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ZodiaCALs"
SPDX-License-Identifier = "CC-BY-ND-4.0"

# Self-contained HTML pages: their text and figures are CC-BY-ND-4.0; their
# stylesheet, scripts and icon sprite are Apache-2.0.
[[annotations]]
path = ["standard/**", "index.html", "sample/**", "brand/index.html"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ZodiaCALs"
SPDX-License-Identifier = "CC-BY-ND-4.0 AND Apache-2.0"

# The Misty mark: CC-BY-ND-4.0, and the trademark policy in TRADEMARKS.md.
[[annotations]]
path = "brand/marks/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ZodiaCALs"
SPDX-License-Identifier = "CC-BY-ND-4.0"
